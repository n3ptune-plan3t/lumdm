# lumdm system defaults. Per-user overrides: ~/.config/lumdm.conf
theme   = mocha        # mocha | tokyo | nord | gruvbox | rose
numlock = keep         # on | off | keep
xserver = /usr/bin/X
xinit   = /usr/bin/xinit

# Function keys F1..F12. Actions:
#   poweroff reboot suspend hibernate theme showpw none
#   exec:<command>   (this file only - runs as root)
f2 = poweroff
f3 = reboot
f4 = suspend
f5 = theme
f6 = showpw
#f7 = exec:/usr/local/bin/wifi-menu
#f7_label = wifi
#f12 = hibernate
