# lumdm system defaults. Per-user overrides: ~/.config/lumdm.conf
# Check what is actually in effect (and why a line was ignored):  lumdm --check [user]
theme     = mocha        # mocha | tokyo | nord | gruvbox | rose
wallpaper = festival     # festival | ocean | forest | none | random   (F-key action "wallpaper" cycles)
numlock   = keep         # on | off | keep
xserver   = /usr/bin/X
xinit     = /usr/bin/xinit

# Console font (this file only). Any installed TrueType/OpenType font, by name or absolute path.
# Monospace fonts look best. Needs the real Linux console (not a terminal emulator).
# Try one with:  lumdm --font-test "JetBrains Mono" 16
#font      = JetBrains Mono   # searched in /usr/share/fonts, /usr/local/share/fonts, ...; or /path/to/Font.ttf
#font_size = 16               # cell height in pixels (8-32); the zoom keys scale this

# Function keys F1..F12 (case-insensitive). Actions:
#   poweroff reboot suspend hibernate theme wallpaper showpw none
#   reload restart stop
#   scale+ scale- scale0
#   exec:<command>   (this file only - runs as root)
# Optional label shown in the bottom bar:  f6_label = my label
f1 = poweroff
f2 = reboot
f3 = suspend
f4 = theme
f5 = showpw
f6 = wallpaper
#f7 = reload
#f8 = restart
#f9 = stop
#f10 = scale+
#f11 = scale-
#f12 = scale0
