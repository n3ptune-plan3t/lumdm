# ~/.config/lumdm.conf - per-user overrides, read when this user is selected at the login screen.
# Allowed: theme, wallpaper, numlock, fN, fN_label (built-in actions only; no exec:, no font).
# Symlinks (stow, chezmoi, ...) are fine. Run `lumdm --check <you>` to see what is picked up.
#theme     = mocha        # mocha | tokyo | nord | gruvbox | rose
#wallpaper = festival     # festival | ocean | forest | none | random
#numlock   = keep         # on | off | keep

#f1 = poweroff
#f2 = reboot
#f3 = suspend
#f4 = theme
#f5 = showpw
#f6 = wallpaper
#f7 = reload
#f8 = restart
#f9 = stop
#f10 = scale+
#f11 = scale-
#f12 = scale0
